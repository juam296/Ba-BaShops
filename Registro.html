<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cliente - Ba&BaShops</title>
    <!-- Enlace a Bootstrap CSS para que los estilos queden chéveres y responsivos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- Tarjeta del formulario -->
                <div class="card shadow border-0 rounded-3">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h3 class="mb-0">Ba&BaShops</h3>
                        <small class="text-muted">Crea tu cuenta de cliente</small>
                    </div>
                    <div class="card-body p-4">
                        <form id="formRegistro">
                            
                            <!-- Nombre completo -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ej. Juan Pérez" required>
                            </div>

                            <!-- Tipo y número de documento -->
                            <div class="row">
                                <div class="col-md-5 mb-3">
                                    <label for="tipoDoc" class="form-label">Tipo de Documento</label>
                                    <select class="form-select" id="tipoDoc" required>
                                        <option value="">Seleccione...</option>
                                        <option value="CC">Cédula de Ciudadanía</option>
                                        <option value="CE">Cédula de Extranjería</option>
                                        <option value="TI">Tarjeta de Identidad</option>
                                    </select>
                                </div>
                                <div class="col-md-7 mb-3">
                                    <label for="documento" class="form-label">N° de Documento</label>
                                    <input type="number" class="form-control" id="documento" placeholder="Número de documento" required>
                                </div>
                            </div>

                            <!-- Correo y Teléfono -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">Correo Electrónico</label>
                                    <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="telefono" class="form-label">Teléfono / Celular</label>
                                    <input type="tel" class="form-control" id="telefono" placeholder="3001234567">
                                </div>
                            </div>

                            <!-- Contraseña -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="password" placeholder="******" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="******" required>
                                </div>
                            </div>

                            <!-- Botón de envío -->
                            <div class="d-grid gap-2 mt-3">
                                <button type="submit" class="btn btn-dark btn-lg">Registrarme</button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center py-3 bg-white">
                        <small>¿Ya tienes una cuenta? <a href="#" class="text-decoration-none">Inicia sesión</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script opcional de validación básica con JS -->
    <script>
        document.getElementById('formRegistro').addEventListener('submit', function(e) {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            if (pass !== confirmPass) {
                alert('¡Las contraseñas no coinciden!');
                return;
            }

            alert('¡Registro simulado con éxito en Ba&BaShops!');
            this.reset();
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
